<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IA Compra Pisos</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; } h1 { margin-bottom: 0; } section { margin: 2rem 0; } form, .actions { display: flex; gap: .6rem; flex-wrap: wrap; align-items: end; } label { display: grid; gap: .25rem; } input, select, button { font: inherit; padding: .45rem .6rem; } button { cursor: pointer; } table { width: 100%; border-collapse: collapse; margin-top: .8rem; } th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #8885; vertical-align: top; } .error { color: #c22; } .muted { color: #777; } .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: .8rem; margin-top: 1rem; } .metric { border: 1px solid #8885; border-radius: .7rem; padding: .9rem; background: #8881; } .metric strong { display: block; font-size: 1.35rem; margin: .3rem 0; } .metric small { color: #777; } .coverage { margin-top: 1rem; padding: .75rem; border-left: 4px solid #568bd8; background: #568bd812; } @media (max-width: 700px) { body { margin-top: 1rem; } table { font-size: .85rem; } .scroll { overflow-x: auto; } }
  </style>
</head>
<body>
  <h1>IA Compra Pisos</h1>
  <p class="muted">Radiografía territorial del mercado residencial español.</p>

  <section>
    <h2 id="market-title">Ficha de mercado · León</h2>
    <form id="market-filters">
      <label>Territorio <input name="geography_name" value="León" aria-label="Nombre del territorio"></label>
      <label>Código <input name="geography_code" value="PROV:24" required aria-label="Código geográfico"></label>
      <label>Vivienda tipo (m²) <input name="home_size_m2" type="number" min="1" value="90"></label>
      <label>Financiación (%) <input name="ltv_pct" type="number" min="1" max="100" value="80"></label>
      <label>Plazo (años) <input name="term_years" type="number" min="1" max="50" value="25"></label>
      <button>Actualizar ficha</button>
    </form>
    <div id="market-card" class="card-grid"></div>
    <h3>Analytics derivados</h3>
    <div id="derived-card" class="card-grid"></div>
    <div id="coverage" class="coverage muted">Cargando cobertura…</div>
  </section>

  <section>
    <h2>Explorador de datos</h2>
    <form id="filters">
      <label>Indicador <input name="indicator_code" placeholder="Ej. ine_transmissions"></label>
      <label>Geografía <input name="geography_code" placeholder="Ej. ES"></label>
      <label>Desde <input name="date_from" type="date"></label>
      <label>Hasta <input name="date_to" type="date"></label>
      <button>Buscar datos</button>
    </form>
    <div class="actions"><button id="latest">Último dato por serie</button><button id="catalog">Catálogo</button></div>
    <p id="summary" class="muted"></p>
    <div class="scroll"><table id="data"><thead></thead><tbody></tbody></table></div>
  </section>

  <section>
    <h2>Ingestas</h2>
    <div class="actions"><button id="runs">Actualizar ejecuciones</button></div>
    <div class="scroll"><table id="run-data"><thead></thead><tbody></tbody></table></div>
    <h3>Lanzar ingesta</h3>
    <form id="ingest">
      <label>Fuente <select name="source" id="source"></select></label>
      <label>Clave API <input name="api_key" type="password" autocomplete="off"></label>
      <label>Desde <input name="date_from" type="date"></label>
      <button>Ejecutar</button>
    </form>
    <p id="message"></p>
  </section>

  <script>
    const $ = s => document.querySelector(s);
    const api = '/api/v1';
    const marketLabels = {
      price_eur_m2: 'Precio', annual_household_net_income_eur: 'Renta neta hogar',
      salary_income_weight_pct: 'Peso salarios', mortgages_yoy_pct: 'Hipotecas interanual',
      new_mortgage_apr_pct: 'TAE nuevas hipotecas', new_financing_volume_eur: 'Financiación nueva',
      euribor_12m_pct: 'Euríbor 12 meses', estimated_purchase_effort_pct: 'Esfuerzo estimado',
      mortgage_spread_pp: 'Spread hipotecario', price_to_income_years: 'Price-to-income',
      price_to_rent_years: 'Price-to-rent', income_adjusted_price_yoy_pct: 'Precio ajustado por renta'
    };
    const number = (value, digits = 1) => new Intl.NumberFormat('es-ES', {maximumFractionDigits: digits, minimumFractionDigits: digits}).format(value);
    const metricValue = (metric, key) => {
      if (!metric || metric.value == null) return 'Sin dato';
      if (metric.unit === 'eur_m2') return `${number(metric.value, 0)} €/m²`;
      if (metric.unit === 'eur_year') return `${number(metric.value, 0)} €/año`;
      if (metric.unit === 'eur') return `${number(metric.value, 0)} €`;
      if (metric.unit === 'percent') {
        const signed = ['mortgages_yoy_pct', 'income_adjusted_price_yoy_pct'].includes(key);
        return `${signed && metric.value > 0 ? '+' : ''}${number(metric.value)} %`;
      }
      if (metric.unit === 'percentage_points') return `${number(metric.value, 2)} pp`;
      if (metric.unit === 'years') return `${number(metric.value, 1)} años`;
      return number(metric.value);
    };
    const renderMetrics = (target, metrics) => {
      target.innerHTML = '';
      Object.entries(metrics).forEach(([key, metric]) => {
        const card = document.createElement('article'); card.className = 'metric';
        const label = document.createElement('span'); label.textContent = marketLabels[key] || key;
        const value = document.createElement('strong'); value.textContent = metricValue(metric, key);
        const detail = document.createElement('small');
        detail.textContent = metric?.period ? `${metric.period} · ${metric.source || 'calculado'}` : (metric?.value == null ? 'Pendiente de cobertura' : 'Calculado por el backend');
        card.append(label, value, detail); target.append(card);
      });
    };
    const loadMarket = async () => {
      const form = new FormData($('#market-filters')); const code = form.get('geography_code').trim();
      const params = new URLSearchParams({home_size_m2: form.get('home_size_m2'), ltv_pct: form.get('ltv_pct'), term_years: form.get('term_years')});
      const result = await get(`${api}/markets/${encodeURIComponent(code)}/summary?${params}`);
      $('#market-title').textContent = `Ficha de mercado · ${form.get('geography_name') || code}`;
      renderMetrics($('#market-card'), result.market_card);
      const derived = {...result.derived}; delete derived.historical_percentiles;
      renderMetrics($('#derived-card'), derived);
      const p = result.derived.historical_percentiles;
      $('#coverage').textContent = `Cobertura ${result.coverage.available_fields}/${result.coverage.total_fields} (${number(result.coverage.ratio_pct, 0)} %). Percentiles históricos — precio: ${p.price ?? 'N/D'}, price-to-income: ${p.price_to_income ?? 'N/D'}, price-to-rent: ${p.price_to_rent ?? 'N/D'}.`;
    };
    const show = (table, rows) => {
      const columns = [...new Set(rows.flatMap(Object.keys))];
      table.querySelector('thead').innerHTML = `<tr>${columns.map(c => `<th>${c}</th>`).join('')}</tr>`;
      table.querySelector('tbody').innerHTML = rows.map(row => `<tr>${columns.map(c => `<td>${row[c] ?? ''}</td>`).join('')}</tr>`).join('');
    };
    const get = async url => { const r = await fetch(url); if (!r.ok) throw Error(await r.text()); return r.json(); };
    $('#market-filters').onsubmit = e => { e.preventDefault(); loadMarket().catch(error => $('#coverage').textContent = error.message); };
    const loadObservations = async (latest = false) => {
      const params = new URLSearchParams(new FormData($('#filters'))); [...params.entries()].forEach(([k,v]) => !v && params.delete(k));
      const result = await get(`${api}/analytics/${latest ? 'latest' : 'observations'}?${params}`);
      const rows = result.data || result; show($('#data'), rows); $('#summary').textContent = `${rows.length} registros`;
    };
    $('#filters').onsubmit = async e => { e.preventDefault(); try { await loadObservations(); } catch (e) { $('#summary').textContent = e.message; } };
    $('#latest').onclick = () => loadObservations(true).catch(e => $('#summary').textContent = e.message);
    $('#catalog').onclick = async () => { const result = await get(`${api}/analytics/catalog`); show($('#data'), result.data); $('#summary').textContent = `${result.count} indicadores`; };
    $('#runs').onclick = async () => { const rows = await get(`${api}/ingestions/runs`); show($('#run-data'), rows); };
    $('#ingest').onsubmit = async e => {
      e.preventDefault(); const form = new FormData(e.currentTarget); const parameters = form.get('date_from') ? {date_from: form.get('date_from')} : {};
      const r = await fetch(`${api}/ingestions/${form.get('source')}`, {method:'POST', headers:{'Content-Type':'application/json','X-API-Key':form.get('api_key')}, body:JSON.stringify({requested_by:'web', parameters})});
      $('#message').textContent = r.ok ? 'Ingesta terminada.' : `Error: ${await r.text()}`; $('#message').className = r.ok ? '' : 'error'; if (r.ok) $('#runs').click();
    };
    get(`${api}/ingestions/sources`).then(({sources}) => { $('#source').innerHTML = sources.map(s => `<option>${s}</option>`).join(''); });
    loadMarket().catch(e => $('#coverage').textContent = e.message); loadObservations().catch(e => $('#summary').textContent = e.message); $('#runs').click();
  </script>
</body>
</html>
